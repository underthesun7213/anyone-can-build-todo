<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}To-do list{% endblock %}</title>
  <link rel="icon" href="data:,">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    form.inline { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    form.inline input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    li .title { flex: 1; }
    li.done .title { text-decoration: line-through; color: #666; }
    button { padding: 0.4rem 0.8rem; font-size: 0.9rem; cursor: pointer; }
    a.button { padding: 0.4rem 0.8rem; font-size: 0.9rem; color: inherit; text-decoration: none; border: 1px solid #ccc; border-radius: 3px; }
    .errorlist { padding: 0; list-style: none; }
    .messages li { border-bottom: none; padding: 0.25rem 0; }
    .errorlist, .messages .error { color: #b00; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
